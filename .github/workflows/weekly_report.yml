name: Weekly Tech Report

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send email after generating the report"
        required: false
        default: false
        type: boolean
      selected_urls:
        description: "Paste newline-separated selected article URLs from review.html"
        required: false
        default: ""
        type: string

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run main.py
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SEARCH_MODE: ${{ secrets.SEARCH_MODE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          AUTO_SEND_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email || 'false' }}
          SELECTED_URLS: ${{ inputs.selected_urls }}
        run: python main.py

      - name: Configure git identity
        run: |
          git config user.name "EOSL Tech Radar Bot"
          git config user.email "eosl-tech-radar-bot@users.noreply.github.com"

      - name: Commit and push new report
        run: |
          git add data/raw/ data/debug/ docs/
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          REPORT_DATE=$(date -u '+%Y-%m-%d')
          git commit -m "chore: weekly tech report ${REPORT_DATE} [skip ci]"
          git push
