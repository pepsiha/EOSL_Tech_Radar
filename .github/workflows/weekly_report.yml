name: Weekly Tech Report

on:
  schedule:
    # 每週日 UTC 13:00 = 台灣時間 21:00
    - cron: "0 13 * * 0"
  workflow_dispatch:  # 允許手動觸發

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 使用 GH_PAT 以便後續 push（GITHUB_TOKEN 對 GitHub Pages branch 有限制）
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run main.py
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SEARCH_MODE: ${{ secrets.SEARCH_MODE }}
        run: python main.py

      - name: Configure git identity
        run: |
          git config user.name "EOSL Tech Radar Bot"
          git config user.email "eosl-tech-radar-bot@users.noreply.github.com"

      - name: Commit and push new report
        run: |
          git add data/raw/ docs/
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          REPORT_DATE=$(date -u '+%Y-%m-%d')
          git commit -m "chore: weekly tech report ${REPORT_DATE} [skip ci]"
          git push
